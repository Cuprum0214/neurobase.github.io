<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e5fa8">
  <meta name="description" content="NeuroBase 拼写与缩写训练答题页：逐题作答，检查后进入下一题，全部答完查看学习结果总结。">
  <title>拼写与缩写训练 · 答题 · NeuroBase</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/css/style.css?v=1196">
  <script>
    (function () {
      try {
        var m = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : false;
        var th = localStorage.getItem('nb-theme') || 'system';
        if (th === 'dark' || (th === 'system' && m)) document.documentElement.classList.add('dark');
      } catch (e) {}
      try {
        var f = parseFloat(localStorage.getItem('nb-font') || '100');
        if (f >= 25 && f <= 300) document.documentElement.style.setProperty('--nb-font-scale', (f / 100).toFixed(2));
      } catch (e) {}
      try {
        if (localStorage.getItem('nb-motion') === 'off') document.documentElement.classList.add('motion-off');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="action.skipToContent">跳到主内容</a>
  <header id="nb-header"></header>

  <main id="main" class="nb-content">
    <div class="wrap">
      <h1 class="page-title" data-i18n="spelling.title">拼写与缩写训练</h1>
      <p class="page-desc" data-i18n="spelling.flow">选题 → 逐题作答 → 查看学习结果</p>

      <section class="sp-run" id="sp-run" aria-live="polite">
        <p class="sp-progress" id="sp-progress"></p>
        <div class="sp-prompt" id="sp-prompt"></div>
        <div class="sp-listen" id="sp-listen" hidden>
          <button type="button" class="btn btn-ghost" id="sp-speak" data-i18n="spelling.listen">朗读</button>
        </div>
        <form class="sp-answer" id="sp-answer">
          <label class="sr-only" for="sp-input" data-i18n="spelling.inputLabel">填写英文名称或缩写</label>
          <input type="text" id="sp-input" class="sp-input" autocomplete="off" spellcheck="false"
                 data-i18n-placeholder="spelling.placeholder">
          <button type="submit" class="btn" id="sp-check" data-i18n="spelling.check">检查</button>
        </form>
        <p class="sp-feedback" id="sp-feedback" role="status"></p>
        <div class="sp-result-actions" id="sp-nav" hidden>
          <button type="button" class="btn" id="sp-next" data-i18n="spelling.next">下一题</button>
          <button type="button" class="btn" id="sp-finish" data-i18n="spelling.resultDone">查看学习结果</button>
        </div>
      </section>

      <p class="notice" id="sp-nosession" hidden data-i18n="spelling.noSession">没有进行中的训练，请先回到选题页开始。</p>

      <!-- 答题过程中不提供返回入口，避免中途退出丢失作答；仅在无进行中会话时由脚本显示 -->
      <div class="qz-footer" id="sp-footer" hidden>
        <a class="btn btn-ghost" id="sp-to-setup" href="spelling.html" data-i18n="spelling.goSetup">去选题</a>
        <a class="btn nb-back" id="sp-to-learn" href="learn.html" data-i18n="learn.backToLearn">返回学习工具</a>
      </div>
    </div>
  </main>

  <footer id="nb-footer"></footer>

  <noscript>
    <div class="wrap">
      <p class="notice">本页的拼写训练由本地脚本渲染，请启用 JavaScript 后再访问。</p>
    </div>
  </noscript>

  <script src="assets/js/data/terms.js?v=1196"></script>
  <script src="assets/js/data/i18n.js?v=1196"></script>
  <script src="assets/js/core.js?v=1196"></script>
  <script src="assets/js/cloud-config.js?v=1196"></script>
  <script src="assets/js/cloud.js?v=1196"></script>
  <script src="assets/js/auth-ui.js?v=1196"></script>
  <script src="assets/js/ai-fluid.js?v=1196"></script>
  <script src="assets/js/ai-tutor.js?v=1196"></script>
  <script src="assets/js/feedback.js?v=1196"></script>
  <script src="assets/js/help.js?v=1196"></script>
  <script src="assets/js/learn.js?v=1196"></script>
  <script src="assets/js/page-spelling-run.js?v=1196"></script>
</body>
</html>
