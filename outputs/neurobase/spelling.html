<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e5fa8">
  <meta name="description" content="NeuroBase 拼写与缩写训练：选题后进入答题页逐题作答，答完查看学习结果总结；答错自动进错题本。">
  <title>拼写与缩写训练 · NeuroBase</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/css/style.css?v=1201">
  <script>
    (function () {
      try {
        var m = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : false;
        var th = localStorage.getItem('nb-theme') || 'system';
        if (th === 'dark' || (th === 'system' && m)) document.documentElement.classList.add('dark');
      } catch (e) {}
      try {
        var f = parseFloat(localStorage.getItem('nb-font') || '100');
        if (f >= 25 && f <= 300) document.documentElement.style.setProperty('--nb-font-scale', (f / 100).toFixed(2));
      } catch (e) {}
      try {
        if (localStorage.getItem('nb-motion') === 'off') document.documentElement.classList.add('motion-off');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="action.skipToContent">跳到主内容</a>
  <header id="nb-header"></header>

  <main id="main" class="nb-content">
    <div class="wrap">
      <h1 class="page-title" data-i18n="spelling.title">拼写与缩写训练</h1>
      <p class="page-desc" data-i18n="spelling.desc">分三步：先选训练模式与范围，再进入答题页逐题作答，最后查看学习结果总结。输入不分大小写，答错自动进错题本。</p>

      <form class="sp-setup" id="sp-setup">
        <div class="sp-field">
          <label for="sp-mode" class="sp-label" data-i18n="spelling.mode">训练模式</label>
          <select id="sp-mode" class="sp-select">
            <option value="zh2en" data-i18n="spelling.modeZhToEn">看释义写英文</option>
            <option value="zh2name" data-i18n="spelling.modeZhToName">看中文写英文</option>
            <option value="en2zh" data-i18n="spelling.modeEnToZh">看英文写中文</option>
            <option value="abbr" data-i18n="spelling.modeAbbr">缩写训练</option>
            <option value="dict" data-i18n="spelling.modeDict">听写（朗读发音）</option>
          </select>
        </div>
        <div class="sp-field">
          <label for="sp-module" class="sp-label" data-i18n="quiz.module">题目范围</label>
          <select id="sp-module" class="sp-select"></select>
        </div>
        <div class="sp-field">
          <label for="sp-count" class="sp-label" data-i18n="spelling.countLabel">本轮题数</label>
          <select id="sp-count" class="sp-select">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
          </select>
        </div>
        <div class="sp-actions">
          <button type="submit" class="btn btn-primary" data-i18n="spelling.check">开始训练</button>
        </div>
        <p class="sp-feedback" id="sp-feedback" role="status"></p>
      </form>

      <div class="qz-footer">
        <a class="btn qz-back-btn qz-back-btn--outline" id="sp-to-learn" href="learn.html" data-i18n="learn.backToLearn">返回学习工具</a>
      </div>
    </div>
  </main>

  <footer id="nb-footer"></footer>

  <noscript>
    <div class="wrap">
      <p class="notice">本页的拼写训练由本地脚本渲染，请启用 JavaScript 后再访问。</p>
    </div>
  </noscript>

  <script src="assets/js/data/terms.js?v=1201"></script>
  <script src="assets/js/data/i18n.js?v=1201"></script>
  <script src="assets/js/core.js?v=1201"></script>
  <script src="assets/js/cloud-config.js?v=1201"></script>
  <script src="assets/js/cloud.js?v=1201"></script>
  <script src="assets/js/auth-ui.js?v=1201"></script>
  <script src="assets/js/ai-fluid.js?v=1201"></script>
  <script src="assets/js/ai-tutor.js?v=1201"></script>
  <script src="assets/js/feedback.js?v=1201"></script>
  <script src="assets/js/help.js?v=1201"></script>
  <script src="assets/js/learn.js?v=1201"></script>
  <script src="assets/js/page-spelling.js?v=1201"></script>
</body>
</html>
