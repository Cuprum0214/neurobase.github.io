  <!-- 在样式生效前定好主题与正文字号，避免首屏闪烁（两件事各自 try，互不牵连） -->
  <script>
    (function () {
      try {
        var m = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : false;
        var th = localStorage.getItem('nb-theme') || 'system';
        if (th === 'dark' || (th === 'system' && m)) document.documentElement.classList.add('dark');
      } catch (e) {}
      try {
        var f = parseFloat(localStorage.getItem('nb-font') || '100');
        if (f >= 25 && f <= 300) document.documentElement.style.setProperty('--nb-font-scale', (f / 100).toFixed(2));
      } catch (e) {}
      try {
        if (localStorage.getItem('nb-motion') === 'off') document.documentElement.classList.add('motion-off');
      } catch (e) {}
    })();
  </script>
</head>

  <a class="skip-link" href="#main" data-i18n="action.skipToContent">跳到主内容</a>

      <section aria-labelledby="lab-modules-title">

        <div class="grid-2 lab-entry" id="lab-entry">

            <p class="tool-stat" data-i18n="lab.enter">进入</p>
          </a>
          <a class="tool-card" href="lab-cogsim.html">

            <p class="tool-desc" data-i18n="lab.cardCogsimDesc">Stroop 效应 · 反应时 · 记忆广度</p>
            <p class="tool-stat" data-i18n="lab.enter">进入</p>
          </a>
          <a class="tool-card" href="lab-signals.html">

            <p class="tool-stat" data-i18n="lab.enter">进入</p>
          </a>
          <a class="tool-card" href="lab-bci.html">
            <p class="tool-icon" aria-hidden="true">🔌</p>
            <p class="tool-name" data-i18n="lab.cardBci">BCI 案例拆解</p>
            <p class="tool-desc" data-i18n="lab.cardBciDesc">P300 拼写器 · SSVEP 控制 · 运动想象假肢 · 侵入式系统</p>
            <p class="tool-stat" data-i18n="lab.enter">进入</p>
          </a>
        </div>

      <p class="lab-note" data-i18n="lab.moduleNote">本页演示为教学示意，用于帮助理解概念，不等同于真实实验数据。</p>
