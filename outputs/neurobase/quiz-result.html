<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e5fa8">
  <meta name="description" content="NeuroBase 测验结果与解析：查看得分、正确/错误题数与逐题解析，可再测一次。">
  <title>测验结果 · NeuroBase</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/css/style.css?v=1194">
  <script>
    (function () {
      try {
        var m = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : false;
        var th = localStorage.getItem('nb-theme') || 'system';
        if (th === 'dark' || (th === 'system' && m)) document.documentElement.classList.add('dark');
      } catch (e) {}
      try {
        var f = parseFloat(localStorage.getItem('nb-font') || '100');
        if (f >= 25 && f <= 300) document.documentElement.style.setProperty('--nb-font-scale', (f / 100).toFixed(2));
      } catch (e) {}
      try {
        if (localStorage.getItem('nb-motion') === 'off') document.documentElement.classList.add('motion-off');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="action.skipToContent">跳到主内容</a>
  <header id="nb-header"></header>

  <main id="main" class="nb-content">
    <div class="wrap">
      <h1 class="page-title" data-i18n="quiz.resultTitle">测验结果与解析</h1>
      <p class="page-desc" data-i18n="quiz.flow">选题 → 作答并提交 → 查看结果与解析</p>

      <section class="qz-result-card" id="qz-result" aria-live="polite">
        <p class="result-line" id="qz-score"></p>
        <p class="result-sub" id="qz-rate"></p>
        <div id="qz-review"></div>
        <p class="notice" id="qz-result-empty" hidden data-i18n="quiz.noSession">没有进行中的测验，请先回到选题页开始。</p>
      </section>

      <div class="qz-footer">
        <button type="button" class="btn" id="qz-again" data-i18n="quiz.again">再测一次</button>
        <a class="btn qz-back-btn qz-back-btn--solid" id="qz-to-learn" href="learn.html" data-i18n="learn.backToLearn">返回学习工具</a>
      </div>
    </div>
  </main>

  <footer id="nb-footer"></footer>

  <noscript>
    <div class="wrap">
      <p class="notice">本页的测验结果由本地脚本渲染，请启用 JavaScript 后再访问。</p>
    </div>
  </noscript>

  <script src="assets/js/data/terms.js?v=1194"></script>
  <script src="assets/js/data/i18n.js?v=1194"></script>
  <script src="assets/js/core.js?v=1194"></script>
  <script src="assets/js/cloud-config.js?v=1194"></script>
  <script src="assets/js/cloud.js?v=1194"></script>
  <script src="assets/js/auth-ui.js?v=1194"></script>
  <script src="assets/js/ai-fluid.js?v=1194"></script>
  <script src="assets/js/ai-tutor.js?v=1194"></script>
  <script src="assets/js/feedback.js?v=1194"></script>
  <script src="assets/js/help.js?v=1194"></script>
  <script src="assets/js/learn.js?v=1194"></script>
  <script src="assets/js/page-quiz-result.js?v=1194"></script>
</body>
</html>
