<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e5fa8">
  <meta name="description" content="NeuroBase 我的学习：学习目标、进度看板、薄弱项推荐与本机数据管理，数据保存在本机。">
  <title>我的学习 · NeuroBase</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/css/style.css?v=1201">
  <script>
    (function () {
      try {
        var m = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)').matches : false;
        var th = localStorage.getItem('nb-theme') || 'system';
        if (th === 'dark' || (th === 'system' && m)) document.documentElement.classList.add('dark');
      } catch (e) {}
      try {
        var f = parseFloat(localStorage.getItem('nb-font') || '100');
        if (f >= 25 && f <= 300) document.documentElement.style.setProperty('--nb-font-scale', (f / 100).toFixed(2));
      } catch (e) {}
      try {
        if (localStorage.getItem('nb-motion') === 'off') document.documentElement.classList.add('motion-off');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="action.skipToContent">跳到主内容</a>
  <header id="nb-header"></header>

  <main id="main" class="nb-content">
    <div class="wrap">
      <h1 class="page-title" data-i18n="dashboard.title">我的学习</h1>
      <p class="page-desc" data-i18n="dashboard.desc">目标、进度看板、薄弱项推荐与本机数据管理集中在这里。</p>

      <section class="card" aria-labelledby="ds-goal-title">
        <div class="ds-head">
          <div>
            <h2 id="ds-goal-title" data-i18n="dashboard.goalTitle">学习目标</h2>
            <p class="meta" data-i18n="dashboard.goalDesc">目标保存在本机浏览器；今日 / 本周完成度自动统计。</p>
          </div>
        </div>

        <div class="ds-goal-row">
          <span class="ds-goal-label" id="ds-goal-daily-label" data-i18n="dashboard.goalDaily">每日新词条</span>
          <div class="ds-choices" id="ds-goal-daily" role="group" aria-labelledby="ds-goal-daily-label"></div>
        </div>
        <div class="ds-goal-row">
          <span class="ds-goal-label" id="ds-goal-weekly-label" data-i18n="dashboard.goalWeekly">每周测验</span>
          <div class="ds-choices" id="ds-goal-weekly" role="group" aria-labelledby="ds-goal-weekly-label"></div>
        </div>
        <p class="cm-hint" id="ds-goal-msg" role="status" aria-live="polite"></p>
      </section>

      <section class="card" aria-labelledby="ds-today-title">
        <h2 id="ds-today-title" data-i18n="dashboard.todayTitle">今日进度</h2>
        <ul class="ds-today" id="ds-today"></ul>
      </section>

      <section class="card" aria-labelledby="ds-board-title">
        <h2 id="ds-board-title" data-i18n="dashboard.boardTitle">进度看板</h2>
        <ul class="ds-board" id="ds-board"></ul>
      </section>

      <section class="card" aria-labelledby="ds-modules-title">
        <div class="ds-head">
          <div>
            <h2 id="ds-modules-title" data-i18n="dashboard.moduleTitle">模块进度</h2>
            <p class="meta" data-i18n="dashboard.moduleHint">按 11 个模块统计已读词条与目标</p>
          </div>
        </div>
        <ul class="ds-modules" id="ds-modules"></ul>
      </section>

      <section class="card" aria-labelledby="ds-weak-title">
        <div class="ds-head">
          <div>
            <h2 id="ds-weak-title" data-i18n="dashboard.weakTitle">薄弱项推荐</h2>
            <p class="meta" data-i18n="dashboard.weakDesc">根据错题与模块进度，优先补这些内容。</p>
          </div>
          <a class="btn btn-ghost btn-sm" href="learn.html" data-i18n="dashboard.reviewMistakes">复习错题</a>
        </div>
        <ul class="ds-weak" id="ds-weak"></ul>
        <p class="empty-hint" id="ds-weak-empty" data-i18n="dashboard.weakEmpty">还没有足够数据 —— 先读几条词条或做一轮测验吧。</p>
      </section>

      <section class="card" aria-labelledby="ds-data-title">
        <h2 id="ds-data-title" data-i18n="dashboard.prefDataTitle">本机数据</h2>

        <div class="ds-reset">
          <p class="meta" data-i18n="dashboard.prefResetHint">仅清除本机浏览 / 收藏 / 错题 / 测验 / 打卡记录，不影响云端数据。</p>
          <button type="button" class="btn btn-ghost btn-sm" id="ds-reset" data-i18n="dashboard.prefReset">清除本机学习数据</button>
          <p class="cm-hint" id="ds-reset-msg" role="status" aria-live="polite"></p>
        </div>
      </section>
    </div>
  </main>

  <footer id="nb-footer"></footer>

  <noscript>
    <div class="wrap">
      <p class="notice">本页的目标与统计由本地脚本渲染，请启用 JavaScript 后再访问。</p>
    </div>
  </noscript>

  <script src="assets/js/data/terms.js?v=1201"></script>
  <script src="assets/js/data/i18n.js?v=1201"></script>
  <script src="assets/js/core.js?v=1201"></script>
  <script src="assets/js/cloud-config.js?v=1201"></script>
  <script src="assets/js/cloud.js?v=1201"></script>
  <script src="assets/js/auth-ui.js?v=1201"></script>
  <script src="assets/js/ai-fluid.js?v=1201"></script>
  <script src="assets/js/ai-tutor.js?v=1201"></script>
  <script src="assets/js/feedback.js?v=1201"></script>
  <script src="assets/js/help.js?v=1201"></script>
  <script src="assets/js/learn.js?v=1201"></script>
  <script src="assets/js/community.js?v=1201"></script>
  <script src="assets/js/page-dashboard.js?v=1201"></script>
</body>
</html>
